name: Deploy to GitHub Pages

# Type checks, tests, builds the Vue app and publishes dist/ to GitHub Pages.
# The site is served from the repository root behind the custom domain in
# public/CNAME, so no base path needs to be configured for the build.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deployments race; a newer push supersedes an in-flight run.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # `npm run build` also copies index.html to 404.html, which is how the
      # client-side routes survive a hard refresh on Pages.
      - name: Build
        run: npm run build

      # enablement lets the first run turn Pages on by itself, so the repository
      # does not need the setting flipped by hand.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
