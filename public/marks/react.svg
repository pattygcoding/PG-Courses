<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-labelledby="react-mark-title">
  <title id="react-mark-title">React</title>
  <!-- The course mark: a nucleus with three orbits. -->
  <defs>
    <radialGradient id="react-mark-glow" cx="50%" cy="38%" r="60%">
      <stop offset="0" stop-color="#61DAFB" stop-opacity="0.16" />
      <stop offset="1" stop-color="#61DAFB" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="1024" height="1024" rx="180" fill="#06090e" />
  <rect x="4" y="4" width="1016" height="1016" rx="176" fill="none" stroke="#16202b" stroke-width="8" />
  <rect width="1024" height="1024" rx="180" fill="url(#react-mark-glow)" />
  <g transform="translate(512, 512)">
    <g fill="none" stroke="#61DAFB" stroke-width="42">
      <ellipse rx="330" ry="128" />
      <ellipse rx="330" ry="128" transform="rotate(60)" />
      <ellipse rx="330" ry="128" transform="rotate(120)" />
    </g>
    <circle r="64" fill="#9BE7FB" />
  </g>
</svg>
