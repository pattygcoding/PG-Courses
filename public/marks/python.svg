<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-labelledby="python-mark-title">
  <title id="python-mark-title">Python</title>
  <!--
    The course mark: two interlocking ribbons with an eye each, in Python's
    blue and yellow.  Geometric shapes only, so it stays crisp at icon size
    and needs no fonts or network.
  -->
  <defs>
    <radialGradient id="python-mark-glow" cx="50%" cy="38%" r="60%">
      <stop offset="0" stop-color="#4B8BBE" stop-opacity="0.16" />
      <stop offset="1" stop-color="#4B8BBE" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="1024" height="1024" rx="180" fill="#06090e" />
  <rect x="4" y="4" width="1016" height="1016" rx="176" fill="none" stroke="#16202b" stroke-width="8" />
  <rect width="1024" height="1024" rx="180" fill="url(#python-mark-glow)" />
  <g>
    <rect x="252" y="196" width="360" height="212" rx="106" fill="#4B8BBE" />
    <circle cx="520" cy="302" r="30" fill="#06090e" />
    <rect x="412" y="616" width="360" height="212" rx="106" fill="#FFD43B" />
    <circle cx="504" cy="722" r="30" fill="#06090e" />
    <rect x="452" y="404" width="120" height="216" fill="#306998" />
  </g>
</svg>
